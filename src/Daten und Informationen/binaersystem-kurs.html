<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binärsystem — Lernkurs Klasse 7</title>
<style>
:root{
  --r:14px;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

/* ---------- Farbschema: dunkel (Standard) ---------- */
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121926;
  --panel:#1B2534;
  --panel-hi:#243044;
  --line:#334357;
  --line-hi:#4A5E76;
  --text:#EAF0F6;
  --soft:#95A6B8;
  --lamp:#FFC24B;
  --lamp-deep:#F0930C;
  --lamp-off:#2B3849;
  --lamp-line:#3A4A5E;
  --lamp-line-hi:#5C7086;
  --lamp-hi:#FFDF9B;
  --lamp-shadow:inset 0 2px 5px rgba(0,0,0,.55);
  --ok:#6FCF97;
  --no:#F08A8A;
  --focus:#7FD3FF;
  --stage:#0E141F;
  --top-bg:rgba(18,25,38,.94);
  --accent-ink:var(--lamp);
  --btn-ink:#241703;
  --btn-hover:#FFD277;
  --choice-on:#2E2718;
}
/* ---------- Farbschema: hell ---------- */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F5F9;
  --panel:#FFFFFF;
  --panel-hi:#E7EDF5;
  --line:#CBD6E2;
  --line-hi:#9FB0C4;
  --text:#131C27;
  --soft:#54677C;
  --lamp:#E89100;
  --lamp-deep:#C26A00;
  --lamp-off:#D3DCE7;
  --lamp-line:#AEBCCC;
  --lamp-line-hi:#7D8FA3;
  --lamp-hi:#B36A00;
  --lamp-shadow:inset 0 2px 4px rgba(15,30,50,.16);
  --ok:#1B7F4F;
  --no:#C0392B;
  --focus:#0B72C4;
  --stage:#EBF0F7;
  --top-bg:rgba(242,245,249,.94);
  --accent-ink:#8A5200;
  --btn-ink:#2A1A03;
  --btn-hover:#FFA824;
  --choice-on:#FFF3DC;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 90px}

/* ---------- Kopf ---------- */
header.top{
  position:sticky;top:0;z-index:20;
  background:var(--top-bg);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:820px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:15px;white-space:nowrap}
.brand span{color:var(--accent-ink)}
.rail{flex:1;display:flex;gap:5px;align-items:center}
.pip{flex:1;height:7px;border-radius:99px;background:var(--lamp-off);min-width:8px}
.pip.done{background:var(--lamp)}
.pip.now{background:var(--lamp);opacity:.55}
.toolbtn{
  background:var(--panel);border:1px solid var(--line);color:var(--soft);
  font:inherit;font-size:13px;padding:6px 11px;border-radius:99px;cursor:pointer;white-space:nowrap
}
.toolbtn:hover{background:var(--panel-hi);color:var(--text)}
#themeToggle{font-size:15px;line-height:1.25;padding:6px 10px}
.toolbtn[aria-pressed="true"]{border-color:var(--lamp);color:var(--accent-ink)}

/* ---------- Typo ---------- */
h1{font-size:clamp(29px,6.4vw,44px);line-height:1.1;letter-spacing:-.03em;font-weight:800;margin:0 0 14px}
h2{font-size:clamp(21px,4.2vw,27px);line-height:1.2;letter-spacing:-.02em;font-weight:750;margin:0 0 10px}
h3{font-size:18px;font-weight:700;margin:26px 0 8px}
p{margin:0 0 14px;max-width:62ch}
.lead{font-size:19px;color:var(--soft);max-width:56ch}
.small{font-size:14.5px;color:var(--soft)}
b,strong{font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bin{font-family:var(--mono);letter-spacing:.16em;font-weight:600}
.eyebrow{font-size:14px;color:var(--soft);margin:0 0 6px}

/* ---------- Karten ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin:18px 0}
.card.flat{background:transparent;border-style:dashed}
.stage{margin:22px 0;padding:24px 16px;background:var(--stage);border:1px solid var(--line);border-radius:var(--r)}

/* ---------- Lampen ---------- */
.lamprow{display:flex;justify-content:center;gap:clamp(6px,2.2vw,14px);flex-wrap:nowrap}
.lampcol{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.lamp{
  --d:clamp(30px,8.4vw,58px);
  width:var(--d);height:var(--d);border-radius:50%;
  background:var(--lamp-off);
  border:2px solid var(--lamp-line);
  box-shadow:var(--lamp-shadow);
  padding:0;cursor:default;position:relative;flex:none;
  transition:background .12s linear, box-shadow .12s linear, border-color .12s linear;
}
.lamp.sq{border-radius:6px}
.lamp.cross{border-radius:6px;clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%)}
.lamp.on{
  background:radial-gradient(circle at 38% 32%, #FFF0C4 0%, var(--lamp) 45%, var(--lamp-deep) 100%);
  border-color:var(--lamp);
  box-shadow:0 0 14px 2px rgba(255,178,32,.55), inset 0 1px 3px rgba(255,255,255,.5);
}
button.lamp{cursor:pointer}
button.lamp:hover{border-color:var(--lamp-line-hi)}
button.lamp.on:hover{border-color:var(--lamp-hi)}
.pv{font-family:var(--mono);font-size:clamp(11px,2.9vw,15px);color:var(--soft);font-variant-numeric:tabular-nums}
.bitlabel{font-family:var(--mono);font-size:clamp(13px,3.4vw,18px);font-weight:700}
.bitlabel.off{color:var(--soft)}
.hidepv .pv{visibility:hidden}
.readout{text-align:center;margin-top:20px;font-family:var(--mono);font-size:clamp(17px,4vw,22px)}
.readout .big{font-size:clamp(30px,7.5vw,44px);font-weight:700;color:var(--accent-ink);display:block;line-height:1.15}
.sum{text-align:center;color:var(--soft);font-family:var(--mono);font-size:clamp(12px,3.2vw,16px);margin-top:12px;word-break:break-word}

/* ---------- Bedienelemente ---------- */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{
  font:inherit;font-weight:650;font-size:16px;
  background:var(--lamp);color:var(--btn-ink);border:none;border-radius:10px;
  padding:13px 22px;cursor:pointer;min-height:48px;
}
.btn:hover{background:var(--btn-hover)}
.btn:disabled{background:var(--lamp-off);color:var(--soft);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel-hi)}
.btn.wide{width:100%}
input[type=number],input[type=text]{
  font:inherit;font-family:var(--mono);font-size:24px;font-weight:700;text-align:center;
  background:var(--stage);color:var(--text);border:2px solid var(--line);border-radius:10px;
  padding:10px 12px;width:150px;min-height:56px;
}
input:focus-visible,button:focus-visible,.lamp:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.choices{display:grid;gap:10px;margin-top:6px}
.choice{
  font:inherit;font-size:17px;text-align:left;
  background:var(--panel-hi);border:2px solid var(--line);color:var(--text);
  border-radius:10px;padding:14px 16px;cursor:pointer;min-height:52px;
}
.choice:hover{border-color:var(--line-hi)}
.choice[aria-pressed="true"]{border-color:var(--lamp);background:var(--choice-on)}

/* ---------- Fortschritt / Aufgaben ---------- */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--soft);font-size:14.5px;margin-bottom:4px}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lamp-off)}
.dot.filled{background:var(--soft)}
.dot.here{background:var(--lamp)}

/* ---------- Auswertung ---------- */
.res{border-left:4px solid var(--line);padding:2px 0 2px 16px;margin:20px 0}
.res.good{border-color:var(--ok)}
.res.bad{border-color:var(--no)}
.verdict{font-weight:700}
.res.good .verdict{color:var(--ok)}
.res.bad .verdict{color:var(--no)}
.score{font-size:clamp(34px,8vw,52px);font-weight:800;font-family:var(--mono);line-height:1}
.tag{display:inline-block;font-size:13px;color:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px}

/* ---------- Übersicht ---------- */
.unitlist{display:grid;gap:10px;margin:20px 0}
.unit{
  display:flex;gap:14px;align-items:center;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;color:var(--text);font:inherit;cursor:pointer;min-height:64px;
}
.unit:hover{background:var(--panel-hi)}
.unit[disabled]{opacity:.45;cursor:not-allowed}
.unit .idx{
  width:38px;height:38px;flex:none;border-radius:50%;background:var(--lamp-off);
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--soft)
}
.unit.done .idx{background:var(--lamp);color:var(--btn-ink)}
.unit .t{font-weight:650;line-height:1.3}
.unit .s{font-size:14px;color:var(--soft)}

/* ---------- Tabelle ---------- */
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:15px;margin:10px 0}
th,td{border:1px solid var(--line);padding:8px 6px;text-align:center}
th{color:var(--soft);font-weight:600;font-size:13px}

/* ---------- Urkunde ---------- */
.cert{background:var(--panel);border:2px solid var(--lamp);border-radius:var(--r);padding:32px;text-align:center}
.cert .who{font-size:clamp(24px,6vw,36px);font-weight:800;margin:14px 0;letter-spacing:-.02em}

@media (max-width:560px){
  .rail{display:none}
  .top-in{gap:9px}
  .brand{font-size:14px}
  .toolbtn{padding:6px 9px}
}
@media (max-width:430px){
  body{font-size:16px}
  .card{padding:17px}
  .wrap{padding:0 13px 80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  header.top,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .cert{border-color:#000;background:#fff}
}
</style>
<script>
/* Farbschema so früh wie möglich setzen, damit es nicht kurz aufblitzt */
(function(){
  var t=null;
  try{ t=localStorage.getItem('binaerkurs.theme'); }catch(e){}
  if(t!=='light' && t!=='dark'){
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme:light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Bit<span>&amp;</span>Lampe</div>
    <div class="rail" id="rail" aria-hidden="true"></div>
    <button class="toolbtn" id="pvToggle" aria-pressed="true">Stellenwerte</button>
    <button class="toolbtn noprint" id="themeToggle" type="button" aria-label="Farbschema wechseln">☀️</button>
    <button class="toolbtn noprint" id="homeBtn">Übersicht</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<script>
/* ============ Werkzeuge ============ */
const $ = s => document.querySelector(s);
const app = () => document.getElementById('app');
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const PV = len => Array.from({length:len},(_,i)=>Math.pow(2,len-1-i));
const toBits = (n,len) => PV(len).map(p => (n & p) ? 1 : 0);
const fromBits = b => b.reduce((s,v,i)=> s + (v ? Math.pow(2,b.length-1-i) : 0), 0);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function sample(count, lo, hi, avoid){
  const out=[], seen=new Set(avoid||[]);
  let guard=0;
  while(out.length<count && guard++<600){
    const v = lo + rnd(hi-lo+1);
    if(seen.has(v)) continue;
    seen.add(v); out.push(v);
  }
  return out;
}

/* Rechenweg als Text: 1011 -> "8 + 2 + 1 = 11" */
function sumText(bits){
  const p = PV(bits.length).filter((_,i)=>bits[i]===1);
  if(!p.length) return '0 (keine Lampe leuchtet)';
  return p.join(' + ') + ' = ' + p.reduce((a,b)=>a+b,0);
}

/* ============ Lampen zeichnen ============ */
function lamps(bits, opt={}){
  const {interactive=false, shape='', showPv=true, showBits=true, id=''} = opt;
  const pv = PV(bits.length);
  const cols = bits.map((b,i)=>{
    const cls = 'lamp '+shape+(b?' on':'');
    const el = interactive
      ? `<button type="button" class="${cls}" data-i="${i}" aria-pressed="${b?'true':'false'}" aria-label="Stellenwert ${pv[i]}, ${b?'an':'aus'}"></button>`
      : `<div class="${cls}" role="img" aria-label="Stellenwert ${pv[i]}, ${b?'an':'aus'}"></div>`;
    return `<div class="lampcol">${el}`
      + (showBits ? `<div class="bitlabel${b?'':' off'}">${b}</div>` : '')
      + (showPv ? `<div class="pv">${pv[i]}</div>` : '')
      + `</div>`;
  }).join('');
  return `<div class="lamprow" ${id?`id="${id}"`:''}>${cols}</div>`;
}

/* ============ Widgets für die Erklärseiten ============ */
const widgets = {};

widgets.play = (len) => ({
  html: `<div class="stage">
      <div id="wLamps"></div>
      <div class="readout"><span class="big" id="wVal">0</span><span class="small">im Dezimalsystem</span></div>
      <div class="sum" id="wSum">Tippe die Lampen an.</div>
    </div>`,
  mount(){
    let bits = new Array(len).fill(0);
    const draw = () => {
      $('#wLamps').innerHTML = lamps(bits,{interactive:true});
      $('#wVal').textContent = fromBits(bits);
      $('#wSum').textContent = sumText(bits);
      $('#wLamps').querySelectorAll('button').forEach(b=>{
        b.onclick = () => { bits[+b.dataset.i] ^= 1; draw(); };
      });
    };
    draw();
  }
});

widgets.counter = (len) => ({
  html: `<div class="stage">
      <div id="wLamps"></div>
      <div class="readout"><span class="big" id="wVal">0</span></div>
      <div class="row noprint" style="justify-content:center;margin-top:18px">
        <button class="btn ghost" id="wDown">− 1</button>
        <button class="btn" id="wUp">+ 1</button>
        <button class="btn ghost" id="wReset">zurück auf 0</button>
      </div>
      <div class="sum" id="wSum"></div>
    </div>`,
  mount(){
    let n = 0;
    const max = Math.pow(2,len)-1;
    const draw = () => {
      const bits = toBits(n,len);
      $('#wLamps').innerHTML = lamps(bits);
      $('#wVal').textContent = n;
      $('#wSum').textContent = sumText(bits);
      $('#wUp').disabled = n>=max;
      $('#wDown').disabled = n<=0;
    };
    $('#wUp').onclick = ()=>{ if(n<max){n++;draw();} };
    $('#wDown').onclick = ()=>{ if(n>0){n--;draw();} };
    $('#wReset').onclick = ()=>{ n=0;draw(); };
    draw();
  }
});

/* Schritt-für-Schritt: Dezimal -> Binär */
widgets.steps = (len) => ({
  html: `<div class="stage">
      <div class="row noprint" style="justify-content:center;margin-bottom:16px">
        <label class="small" for="wIn">Zahl:</label>
        <input type="number" id="wIn" min="0" max="${Math.pow(2,len)-1}" value="0" style="width:120px">
        <button class="btn ghost" id="wNew">neu starten</button>
      </div>
      <div id="wLamps"></div>
      <div class="sum" id="wStep" style="min-height:3.2em;font-size:16px"></div>
      <div class="row noprint" style="justify-content:center;margin-top:10px">
        <button class="btn" id="wNext">nächster Schritt</button>
      </div>
    </div>`,
  mount(){
    const max = Math.pow(2,len)-1;
    let target=0, rest=0, i=0, bits=new Array(len).fill(0), done=false;
    const pv = PV(len);
    const draw = (msg) => {
      $('#wLamps').innerHTML = lamps(bits);
      $('#wStep').innerHTML = msg;
      $('#wNext').disabled = done;
    };
    const reset = () => {
      target = Math.max(0, Math.min(max, parseInt($('#wIn').value||'0',10)));
      $('#wIn').value = target;
      rest = target; i = 0; bits = new Array(len).fill(0); done = false;
      draw(`Wir starten mit dem Rest <b class="num">${target}</b>. Wir gehen von der größten Lampe nach rechts.`);
    };
    const next = () => {
      if(i>=len){ done=true; return; }
      const p = pv[i];
      let msg;
      if(rest >= p){ bits[i]=1; rest -= p; msg = `Passt <b class="num">${p}</b> in <b class="num">${rest+p}</b>? Ja → Lampe an. Neuer Rest: <b class="num">${rest}</b>.`; }
      else { bits[i]=0; msg = `Passt <b class="num">${p}</b> in <b class="num">${rest}</b>? Nein → Lampe bleibt aus. Rest bleibt <b class="num">${rest}</b>.`; }
      i++;
      if(i>=len){ done = true; msg += `<br>Fertig: <b class="bin">${bits.join('')}</b>`; }
      draw(msg);
    };
    $('#wNext').onclick = next;
    $('#wNew').onclick = reset;
    $('#wIn').onchange = reset;
    $('#wIn').value = 5 + rnd(Math.min(max-5, 200));
    reset();
  }
});

/* Binäruhr St. Gallen */
function clockRows(h,m,s,opt={}){
  const rows = [
    {label:'Stunden', shape:'', v:h},
    {label:'Minuten', shape:'cross', v:m},
    {label:'Sekunden', shape:'sq', v:s}
  ];
  return rows.filter(r=>!(opt.noSeconds && r.label==='Sekunden')).map(r=>
    `<div style="margin:14px 0">
       <div class="small" style="text-align:center;margin-bottom:6px">${r.label}</div>
       ${lamps(toBits(r.v,6),{shape:r.shape, showBits:false, showPv:opt.showPv!==false})}
     </div>`
  ).join('');
}

widgets.clock = () => ({
  html: `<div class="stage"><div id="wClock"></div>
    <div class="readout"><span class="big" id="wTime">--:--:--</span><span class="small">jetzt gerade</span></div></div>`,
  mount(){
    const tick = () => {
      if(!document.getElementById('wClock')){ clearInterval(window.__clockTimer); window.__clockTimer=null; return; }
      const d = new Date();
      const h=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
      $('#wClock').innerHTML = clockRows(h,m,s);
      $('#wTime').textContent = [h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
      applyPv();
    };
    tick();
    if(window.__clockTimer) clearInterval(window.__clockTimer);
    window.__clockTimer = setInterval(tick,1000);
  }
});
/* ============ Aufgaben-Bausteine ============ */
function mc(prompt, correctText, wrongs, explain, visual){
  const opts = [correctText, ...wrongs];
  for(let i=opts.length-1;i>0;i--){ const j=rnd(i+1); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  return {kind:'choice', prompt, visual:visual||'', options:opts,
          correct:opts.indexOf(correctText), correctText, explain};
}
function readTask(n, len, extra){
  const bits = toBits(n,len);
  return {kind:'num', max:Math.pow(2,len)-1,
    prompt: extra || 'Welche Zahl zeigen die Lampen?',
    visual: lamps(bits),
    correct:n, correctText:String(n),
    explain:`Leuchtende Stellenwerte addieren: ${sumText(bits)}.`};
}
function setTask(n, len){
  return {kind:'bits', len,
    prompt:`Stelle die Zahl ${n} mit den Lampen ein.`,
    visual:'', correct:toBits(n,len).join(''), correctText:toBits(n,len).join(''),
    explain:`${n} = ${sumText(toBits(n,len))}. Von links nach rechts prüfen, welcher Stellenwert noch in den Rest passt.`};
}
function clockTask(h,m){
  return {kind:'time',
    prompt:'Wie spät ist es? Trage Stunden und Minuten ein.',
    visual:`<div>${clockRows(h,m,0,{noSeconds:true})}</div>`,
    correct:`${h}:${m}`, correctText:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} Uhr`,
    explain:`Stunden (Kreise): ${sumText(toBits(h,6))}. Minuten (Kreuze): ${sumText(toBits(m,6))}.`};
}

const TIP_PV4 = `<table><tr><th>Lampe</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
  <tr><td>zählt</td><td>8</td><td>4</td><td>2</td><td>1</td></tr></table>
  <p class="small">Leuchtende Lampen addieren — das ist die Zahl.</p>`;
const TIP_PV8 = `<table><tr><th>zählt</th><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr></table>
  <p class="small">Von links nach rechts: Passt der Stellenwert noch in den Rest? Ja → Lampe an, abziehen. Nein → Lampe aus.</p>`;

/* ============ Die Einheiten ============ */
const UNITS = [
{
  id:1, title:'Eine Lampe, zwei Antworten', sub:'Was ein Bit ist',
  teach:[
    {h:'Strom fließt — oder nicht',
     html:`<p>In einem Computer gibt es keine Ziffern von 0 bis 9. Es gibt nur Leitungen, durch die Strom fließt oder eben nicht. Mehr kann die Technik nicht unterscheiden.</p>
       <p>Genau wie eine Lampe: Sie ist <b>an</b> oder <b>aus</b>. Dazwischen gibt es nichts.</p>
       <p>Damit man das aufschreiben kann, hat man sich geeinigt:<br>Lampe an → wir schreiben <b class="bin">1</b>. Lampe aus → wir schreiben <b class="bin">0</b>.</p>
       <p class="small">Probier es aus: Tippe die Lampe an.</p>`,
     w:()=>widgets.play(1)},
    {h:'Das ist ein Bit',
     html:`<p>Eine solche Lampe nennt man in der Informatik ein <b>Bit</b>. Ein Bit ist die kleinste Informationseinheit, die es gibt.</p>
       <p>Ein Bit kann genau zwei Zustände haben: 0 oder 1. Nicht drei, nicht zehn. Zwei.</p>
       <p>Damit kann man schon etwas anfangen: Tür auf oder zu, Licht an oder aus, ja oder nein. Für größere Zahlen brauchen wir aber mehr Lampen — darum geht es gleich.</p>`}
  ],
  tip:`<p>Lampe leuchtet → <b class="bin">1</b>. Lampe ist dunkel → <b class="bin">0</b>.</p>`,
  gen(){
    return [
      mc('Die Lampe leuchtet. Welche Ziffer schreiben wir auf?','1',['0','2','10'],
         'Eine leuchtende Lampe wird als 1 geschrieben.', lamps([1],{showBits:false,showPv:false})),
      mc('Die Lampe ist dunkel. Welche Ziffer schreiben wir auf?','0',['1','8','keine'],
         'Eine dunkle Lampe wird als 0 geschrieben.', lamps([0],{showBits:false,showPv:false})),
      mc('Wie viele verschiedene Zustände kann ein einzelnes Bit haben?','2',['1','8','10'],
         'Ein Bit ist an oder aus — das sind genau 2 Zustände.'),
      mc('Welche Ziffern gibt es im Binärsystem?','nur 0 und 1',['0 bis 9','1 bis 8','0, 1 und 2'],
         'Im Binärsystem gibt es nur die Ziffern 0 und 1, weil eine Lampe nur an oder aus sein kann.'),
      {kind:'bits', len:1, prompt:'Stelle mit der Lampe die Ziffer 1 ein.', visual:'',
       correct:'1', correctText:'1', explain:'Für die 1 muss die Lampe leuchten.'}
    ];
  }
},
{
  id:2, title:'Mehr Lampen, mehr Zahlen', sub:'Zwei und drei Bits',
  teach:[
    {h:'Zwei Lampen können vier Dinge',
     html:`<p>Mit einer Lampe kommen wir nicht weit. Nehmen wir zwei.</p>

       <table><tr><th>Lampen</th><th>Zahl</th></tr>

    {h:'Jede neue Lampe verdoppelt',

{

     html:`<p>Jetzt andersherum: Du bekommst eine Zahl und musst die Lampen richtig setzen.</p>
       <p>Dafür gibt es ein Verfahren, das immer funktioniert. Du gehst von der <b>größten</b> Lampe nach rechts und fragst bei jeder:</p>
       <p><b>Passt dieser Stellenwert noch in meinen Rest?</b><br>

},

/* ============ Zustand & Speicherung ============ */
const KEY = 'binaerkurs.v1';
let mem = {};
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return mem.data || null; } },
  set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){ mem.data = v; } }
};
let S = store.get() || {name:'', done:[], pv:true, attempts:{}};
if(!Array.isArray(S.done)) S.done = [];
if(!S.attempts) S.attempts = {};
const save = () => store.set(S);

let V = {view:'start', u:0, step:0, tasks:[], answers:[], qi:0, showTip:false};

const unitOpen = i => i===0 || S.done.includes(UNITS[i-1].id);
const allDone = () => UNITS.every(u => S.done.includes(u.id));

function applyPv(){ document.body.classList.toggle('hidepv', !S.pv); }

function drawRail(){
  const r = document.getElementById('rail');
  r.innerHTML = UNITS.map((u,i)=>{
    const c = S.done.includes(u.id) ? 'done' : (V.view!=='start' && V.view!=='map' && i===V.u ? 'now' : '');
    return `<div class="pip ${c}"></div>`;
  }).join('');
}

function go(view, patch){ Object.assign(V, patch||{}, {view}); render(); window.scrollTo(0,0); }

/* ============ Bildschirme ============ */
function viewStart(){
  const bits = toBits(rnd(200)+20, 8);
  return `<div style="padding-top:34px">
    <p class="eyebrow">Informatik · Klasse 7</p>
    <h1>Acht Lampen, und du kannst jede Zahl bis 255 lesen.</h1>
    <p class="lead">Computer kennen nur an und aus. In diesem Kurs lernst du Schritt für Schritt, wie man damit rechnet — bis du die Uhr am Bahnhof St. Gallen entziffern kannst.</p>
    <div class="stage">
      <div id="wLamps"></div>
      <div class="readout"><span class="big" id="wVal">0</span></div>
      <div class="sum" id="wSum">Tippe die Lampen an und schau, was passiert.</div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Bevor es losgeht</h3>
      <p class="small">Dein Name kommt am Ende auf die Urkunde. Du kannst das Feld auch leer lassen.</p>
      <div class="row">
        <input type="text" id="nameIn" placeholder="Dein Name" value="${esc(S.name)}" style="width:min(280px,100%);text-align:left;font-family:var(--sans);font-size:18px">
        <button class="btn" id="startBtn">Kurs starten</button>
      </div>
    </div>
    <p class="small">Dein Fortschritt wird auf diesem Gerät gespeichert. Du kannst jederzeit aufhören und später weitermachen.</p>
  </div>`;
}
function mountStart(){
  let bits = new Array(8).fill(0);
  const draw = () => {
    $('#wLamps').innerHTML = lamps(bits,{interactive:true});
    $('#wVal').textContent = fromBits(bits);
    $('#wSum').textContent = sumText(bits);
    $('#wLamps').querySelectorAll('button').forEach(b=> b.onclick = ()=>{ bits[+b.dataset.i]^=1; draw(); });
  };
  draw();
  const start = () => { S.name = $('#nameIn').value.trim(); save();
    const next = UNITS.findIndex((u,i)=> !S.done.includes(u.id) && unitOpen(i));
    go('map'); if(next>=0){ go('teach',{u:next, step:0}); } };
  $('#startBtn').onclick = start;
  $('#nameIn').onkeydown = e => { if(e.key==='Enter') start(); };
}

function viewMap(){
  const items = UNITS.map((u,i)=>{
    const done = S.done.includes(u.id), open = unitOpen(i);
    return `<button class="unit ${done?'done':''}" data-i="${i}" ${open?'':'disabled'}>
      <span class="idx">${done?'✓':u.id}</span>
      <span><span class="t">${u.title}</span><br><span class="s">${u.sub}${open?'':' · noch gesperrt'}</span></span>
    </button>`;
  }).join('');
  const n = S.done.length;
  return `<div style="padding-top:26px">
    <h2>Übersicht</h2>
    <p class="small">${n} von ${UNITS.length} Einheiten geschafft. Eine Einheit gilt als geschafft, wenn du mindestens 4 von 5 Aufgaben richtig hast. Du darfst so oft üben, wie du willst — die Aufgaben sind jedes Mal neu.</p>
    <div class="unitlist">${items}</div>
    ${allDone()?`<button class="btn wide" id="toFinish">Zur Urkunde</button>`:''}
    <p class="small noprint" style="margin-top:30px">
      <button class="toolbtn" id="resetBtn">Fortschritt löschen</button>
    </p>
  </div>`;
}
function mountMap(){
  document.querySelectorAll('.unit').forEach(b=>{
    if(b.disabled) return;
    b.onclick = ()=> go('teach',{u:+b.dataset.i, step:0});
  });
  const f = $('#toFinish'); if(f) f.onclick = ()=> go('finish');
  $('#resetBtn').onclick = ()=>{
    if(confirm('Wirklich allen Fortschritt löschen?')){ S = {name:'',done:[],pv:S.pv,attempts:{}}; save(); go('start'); }
  };
}

function viewTeach(){
  const u = UNITS[V.u], c = u.teach[V.step], last = V.step === u.teach.length-1;
  const w = c.w ? c.w() : null;
  V._w = w;
  return `<div style="padding-top:26px">
    <p class="eyebrow">Einheit ${u.id} von ${UNITS.length} · ${u.title}</p>
    <h2>${c.h}</h2>
    ${c.html}
    ${w ? w.html : ''}
    <div class="row noprint" style="margin-top:26px">
      ${V.step>0?`<button class="btn ghost" id="bBack">Zurück</button>`:''}
      <button class="btn" id="bNext">${last?'Zu den Aufgaben':'Weiter'}</button>
    </div>
    <p class="small" style="margin-top:14px">Seite ${V.step+1} von ${u.teach.length}</p>
  </div>`;
}
function mountTeach(){
  if(V._w) V._w.mount();
  applyPv();
  const u = UNITS[V.u];
  const b = $('#bBack'); if(b) b.onclick = ()=> go('teach',{step:V.step-1});
  $('#bNext').onclick = ()=>{
    if(V.step < u.teach.length-1) go('teach',{step:V.step+1});
    else startQuiz();
  };
}

function startQuiz(){
  const u = UNITS[V.u];
  go('quiz', {tasks: u.gen(), answers: [], qi: 0, showTip:false});
}
/* ============ Aufgaben ============ */
function inputArea(t, cur){
  if(t.kind==='num') return `<div style="text-align:center"><input type="number" id="ans" inputmode="numeric" min="0" max="${t.max}" value="${cur??''}" placeholder="?"></div>`;
  if(t.kind==='choice') return `<div class="choices">${t.options.map((o,i)=>
      `<button type="button" class="choice" data-i="${i}" aria-pressed="${cur===i?'true':'false'}">${o}</button>`).join('')}</div>`;
  if(t.kind==='bits'){
    const bits = cur ? cur.split('').map(Number) : new Array(t.len).fill(0);
    return `<div id="ansLamps">${lamps(bits,{interactive:true})}</div>`;
  }
  if(t.kind==='time'){
    const [h,m] = (cur||':').split(':');
    return `<div class="row" style="justify-content:center;gap:14px">
      <div style="text-align:center"><input type="number" id="ansH" min="0" max="23" value="${h||''}" placeholder="hh" style="width:110px"><div class="small">Stunden</div></div>
      <div style="text-align:center"><input type="number" id="ansM" min="0" max="59" value="${m||''}" placeholder="mm" style="width:110px"><div class="small">Minuten</div></div>
    </div>`;
  }
  return '';
}

function viewQuiz(){
  const u = UNITS[V.u], t = V.tasks[V.qi], cur = V.answers[V.qi];
  const dots = V.tasks.map((_,i)=>`<span class="dot ${i===V.qi?'here':(V.answers[i]!==undefined&&V.answers[i]!==null&&V.answers[i]!==''?'filled':'')}"></span>`).join('');
  const last = V.qi === V.tasks.length-1;
  return `<div style="padding-top:22px">
    <div class="qhead"><span>Einheit ${u.id} · Aufgabe ${V.qi+1} von ${V.tasks.length}</span><span class="dots">${dots}</span></div>
    <div class="card">
      <h2 style="font-size:20px">${t.prompt}</h2>
      ${t.visual?`<div class="stage">${t.visual}</div>`:''}
      ${inputArea(t,cur)}
    </div>
    ${V.showTip?`<div class="card flat">${u.tip}</div>`:''}
    <div class="row noprint">
      ${V.qi>0?`<button class="btn ghost" id="qBack">Zurück</button>`:''}
      <button class="btn" id="qNext">${last?'Antworten abgeben':'Weiter'}</button>
      <button class="toolbtn" id="qTip">${V.showTip?'Hilfe ausblenden':'Hilfe'}</button>
    </div>
    <p class="small" style="margin-top:16px">Die Lösungen siehst du, wenn du alle ${V.tasks.length} Aufgaben abgegeben hast.</p>
  </div>`;
}
function readAnswer(){
  const t = V.tasks[V.qi];
  if(t.kind==='num'){ const v=$('#ans').value.trim(); return v===''?null:Number(v); }
  if(t.kind==='bits'){ return [...$('#ansLamps').querySelectorAll('button')].map(b=>b.classList.contains('on')?1:0).join(''); }
  if(t.kind==='time'){ const h=$('#ansH').value.trim(), m=$('#ansM').value.trim();
    return (h===''||m==='')?null:`${Number(h)}:${Number(m)}`; }
  return V.answers[V.qi];
}
function mountQuiz(){
  applyPv();
  const t = V.tasks[V.qi];
  const stash = () => { const a = readAnswer(); if(a!==undefined) V.answers[V.qi]=a; };
  if(t.kind==='choice'){
    document.querySelectorAll('.choice').forEach(b=> b.onclick = ()=>{
      V.answers[V.qi] = +b.dataset.i;
      document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
    });
  }
  if(t.kind==='bits'){
    $('#ansLamps').querySelectorAll('button').forEach(b=> b.onclick = ()=>{
      b.classList.toggle('on');
      b.setAttribute('aria-pressed', b.classList.contains('on')?'true':'false');
      const col = b.parentElement.querySelector('.bitlabel');
      if(col){ const on=b.classList.contains('on'); col.textContent = on?'1':'0'; col.classList.toggle('off',!on); }
    });
  }
  const focusEl = $('#ans') || $('#ansH');
  if(focusEl) { focusEl.focus(); focusEl.onkeydown = e => { if(e.key==='Enter') $('#qNext').click(); }; }
  const m = $('#ansM'); if(m) m.onkeydown = e => { if(e.key==='Enter') $('#qNext').click(); };
  const bk = $('#qBack'); if(bk) bk.onclick = ()=>{ stash(); go('quiz',{qi:V.qi-1}); };
  $('#qTip').onclick = ()=>{ stash(); go('quiz',{showTip:!V.showTip}); };
  $('#qNext').onclick = ()=>{
    stash();
    if(V.qi < V.tasks.length-1) go('quiz',{qi:V.qi+1});
    else finishQuiz();
  };
}

/* ============ Auswertung ============ */
function isRight(t,a){
  if(a===undefined||a===null||a==='') return false;
  if(t.kind==='num') return Number(a)===t.correct;
  return a===t.correct;
}
function answerText(t,a){
  if(a===undefined||a===null||a==='') return '<span class="small">nichts eingetragen</span>';
  if(t.kind==='choice') return esc(t.options[a]);
  if(t.kind==='bits') return `<span class="bin">${a}</span>`;
  if(t.kind==='time'){ const [h,m]=String(a).split(':');
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} Uhr`; }
  return `<span class="num">${esc(a)}</span>`;
}
function finishQuiz(){
  const u = UNITS[V.u];
  S.attempts[u.id] = (S.attempts[u.id]||0) + 1;
  const score = V.tasks.filter((t,i)=>isRight(t,V.answers[i])).length;
  const need = Math.ceil(V.tasks.length*0.8);
  if(score >= need && !S.done.includes(u.id)) S.done.push(u.id);
  save();
  go('result',{_score:score,_need:need});
}
function viewResult(){
  const u = UNITS[V.u], score = V._score, need = V._need, pass = score>=need;
  const tries = S.attempts[u.id]||1;
  const list = V.tasks.map((t,i)=>{
    const a = V.answers[i], ok = isRight(t,a);
    const mine = t.kind==='bits' && a ? lamps(a.split('').map(Number)) : '';
    const right = t.kind==='bits' ? lamps(t.correct.split('').map(Number)) : '';
    return `<div class="res ${ok?'good':'bad'}">
      <p class="small" style="margin-bottom:4px">Aufgabe ${i+1}</p>
      <p style="margin-bottom:6px">${t.prompt}</p>
      ${t.visual?`<div style="margin:8px 0">${t.visual}</div>`:''}
      <p class="verdict" style="margin-bottom:4px">${ok?'Richtig':'Noch nicht richtig'}</p>
      <p style="margin-bottom:4px">Deine Antwort: ${answerText(t,a)}${mine?`<div style="margin:6px 0">${mine}</div>`:''}</p>
      ${ok?'':`<p style="margin-bottom:4px">Richtig wäre: <b>${esc(t.correctText)}</b></p>${right?`<div style="margin:6px 0">${right}</div>`:''}`}
      <p class="small">${t.explain}</p>
    </div>`;
  }).join('');
  const nextI = V.u+1;
  return `<div style="padding-top:26px">
    <p class="eyebrow">Einheit ${u.id} · ${u.title}</p>
    <p class="score">${score}/${V.tasks.length}</p>
    <h2>${pass?'Einheit geschafft.':'Fast — schau dir die Lösungen an.'}</h2>
    <p>${pass
      ? 'Du hast genug richtig, um weiterzugehen. Sieh dir trotzdem kurz an, wie die Aufgaben gemeint waren.'
      : `Für die nächste Einheit brauchst du ${need} von ${V.tasks.length}. Unten stehen alle Lösungen mit Erklärung. Danach bekommst du neue Aufgaben — so oft du magst.`}</p>
    ${(!pass && tries>=2)?`<div class="card"><h3 style="margin-top:0">Kleine Erinnerung</h3>${u.tip}</div>`:''}
    ${list}
    <div class="row noprint" style="margin-top:26px">
      ${pass
        ? (nextI<UNITS.length
            ? `<button class="btn" id="rNext">Weiter zu Einheit ${UNITS[nextI].id}</button>`
            : `<button class="btn" id="rFinish">Zur Urkunde</button>`)
        : `<button class="btn" id="rAgain">Neue Aufgaben üben</button>
           <button class="btn ghost" id="rTeach">Erklärung noch einmal ansehen</button>`}
      <button class="toolbtn" id="rMap">Übersicht</button>
    </div>
  </div>`;
}
function mountResult(){
  applyPv();
  const b = id => document.getElementById(id);
  if(b('rNext')) b('rNext').onclick = ()=> go('teach',{u:V.u+1, step:0});
  if(b('rFinish')) b('rFinish').onclick = ()=> go('finish');
  if(b('rAgain')) b('rAgain').onclick = ()=> startQuiz();
  if(b('rTeach')) b('rTeach').onclick = ()=> go('teach',{step:0});
  b('rMap').onclick = ()=> go('map');
}

/* ============ Abschluss ============ */
function viewFinish(){
  const d = new Date().toLocaleDateString('de-DE');
  return `<div style="padding-top:30px">
    <div class="cert">
      ${lamps(toBits(255,8),{showBits:false,showPv:false})}
      <h2 style="margin-top:22px">Binärsystem verstanden</h2>
      <p class="who">${S.name ? esc(S.name) : 'Alle acht Einheiten geschafft'}</p>
      <p>hat alle ${UNITS.length} Einheiten abgeschlossen und kann Zahlen zwischen Dezimal- und Binärsystem umrechnen — bis 255, mit Byte und Binäruhr.</p>
      <p class="small">${d}</p>
    </div>
    <div class="row noprint" style="margin-top:24px">
      <button class="btn" id="fPrint">Urkunde drucken</button>
      <button class="btn ghost" id="fMap">Zur Übersicht</button>
    </div>
    <div class="card noprint">
      <h3 style="margin-top:0">Lust auf mehr?</h3>
      <p>Probier zum Spaß: Wie schreibt man deinen Geburtstag binär? Und wie viele Lampen bräuchte man für die Zahl 1000?</p>
      <p class="small">Antwort auf die zweite Frage: 512 + 256 + 128 + 64 + 32 + 8 = 1000, also zehn Lampen.</p>
    </div>
  </div>`;
}
function mountFinish(){
  $('#fPrint').onclick = ()=> window.print();
  $('#fMap').onclick = ()=> go('map');
}

/* ============ Zeichnen ============ */
function render(){
  if(window.__clockTimer){ clearInterval(window.__clockTimer); window.__clockTimer=null; }
  const views = {start:[viewStart,mountStart], map:[viewMap,mountMap], teach:[viewTeach,mountTeach],
                 quiz:[viewQuiz,mountQuiz], result:[viewResult,mountResult], finish:[viewFinish,mountFinish]};
  const [v,m] = views[V.view];
  app().innerHTML = v();
  applyPv(); drawRail(); m();
}
document.getElementById('homeBtn').onclick = ()=> go('map');
/* ---------- Hell / Dunkel ---------- */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const label = t==='dark' ? 'Zum hellen Farbschema wechseln' : 'Zum dunklen Farbschema wechseln';
  themeBtn.textContent = t==='dark' ? '☀️' : '🌙';
  themeBtn.setAttribute('aria-label', label);
  themeBtn.title = label;
}
themeBtn.onclick = ()=>{
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  try{ localStorage.setItem('binaerkurs.theme', next); }catch(e){}
  applyTheme(next);
};
applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

const pvBtn = document.getElementById('pvToggle');
pvBtn.onclick = ()=>{ S.pv = !S.pv; save(); pvBtn.setAttribute('aria-pressed', S.pv?'true':'false'); applyPv(); };
pvBtn.setAttribute('aria-pressed', S.pv?'true':'false');
V.view = (S.done.length || S.name) ? 'map' : 'start';
render();
</script>
</body>
</html>
